extension = "html.jinja"

# Ignore J018: Debug pages can use hardcoded URLs
# Ignore H006: img tag should have height and width attributes
# Ignore T041: a top-level {% set %} before {% extends %} is how a page passes
#   values (e.g. BODY_CLASS) to its parent layout
ignore = "H006,J018,T041"

# Skip agent worktrees, scratch dirs and the generated vibetuner-jinja mirror
extend_exclude = ".claude,.tmp,vibetuner-jinja"

# Use 4 spaces for indentation
indent = 4

# Max line length
max_line_length = 120

# Profile for Jinja templates
profile = "jinja"

# Blank line after load/extends/include tags
blank_line_after_tag = "load,extends,include"

# Disable CSS/JS formatting: djlint's formatters don't understand Jinja
# delimiters ({{ }}) and will mangle them into nested braces.
format_css = false
format_js = false

# Preserve leading spaces on text
preserve_leading_space = false

# Preserve blank lines
preserve_blank_lines = false
