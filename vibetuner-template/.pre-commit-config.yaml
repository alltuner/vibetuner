repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: no-commit-to-branch
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.19
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.8
    hooks:
      - id: rumdl
        name: rumdl check
        pass_filenames: true
        require_serial: true
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: [--check]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            --strict,
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
          ]
  - repo: local
    hooks:
      # Lint with the ruff locked in uv.lock (via vibetuner[dev]), so the
      # hook and `just lint` / CI always run the same ruff version.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Lint with the djlint locked in uv.lock (via vibetuner[dev]) and its
      # djlint.toml, so the hook and `just lint-jinja` always agree.
      - id: djlint
        name: djlint
        entry: uv run --frozen djlint --lint
        language: system
        files: \.html\.jinja$
        require_serial: true
      - id: lint-po
        name: lint-po
        entry: uv run --frozen lint-po
        language: system
        files: \.po$
